name: Build and Release Desktop Application

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: GranolaExporter-macOS.dmg
            artifact_path: dist/GranolaExporter-macOS.dmg
            build_cmd: |
              pyinstaller --windowed --icon=icon.icns --add-data "icon.png:." granolaexporter.py
              brew install create-dmg
              create-dmg \
                --volname "Granola Exporter" \
                --window-size 500 300 \
                --icon-size 100 \
                --icon "GranolaExporter.app" 120 120 \
                --hide-extension "GranolaExporter.app" \
                --app-drop-link 380 120 \
                "dist/GranolaExporter-macOS.dmg" \
                "dist/"
          - os: windows-latest
            artifact_name: GranolaExporter.exe
            artifact_path: dist/GranolaExporter.exe
            build_cmd: |
              pyinstaller --noconsole --onefile --icon=icon.ico --add-data "icon.png;." granolaexporter.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}